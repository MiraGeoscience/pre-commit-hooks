[build-system]
requires = [
    "poetry-core>=1.8.0",
    "poetry-dynamic-versioning>=1.9.1,<2.0",
]
build-backend = "poetry_dynamic_versioning.backend"

[project]
name = "mirageoscience.pre-commit-hooks"
requires-python = ">=3.10,<4.0"
dynamic = ["version"]

[dependency-groups]
dev = [
    "Pygments",
    "pylint",
    "pylint-pytest",
    "pytest",
    "pytest-mock",
    "pytest-cov",
    "tomli",
]

[tool.poetry]

license = "MIT"
description = ""
repository = "https://github.com/MiraGeoscience/pre-commit-hooks"
authors = ["Mira Geoscience <support@mirageoscience.com>"]
readme = "README.rst"

include = [
    "LICENSE",
    "README.rst",
    { path = "mirageoscience/hooks/_version.py", format = ["sdist", "wheel"] },
]

packages = [
    { include = "mirageoscience/hooks" }
]
version = "0.0.0.dev0"

[tool.poetry.scripts]
check_copyright = "mirageoscience.hooks.check_copyright:main"
git_message_hook = "mirageoscience.hooks.git_message_hook:main"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.9.1,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
bump = true
enable = true
fix-shallow-repository = true
strict = true
style = "pep440"
vcs = "git"

[tool.poetry-dynamic-versioning.substitution]
files = ["mirageoscience/hooks/_version.py", "_version.json"]
patterns = [
    '''(^__version__\s*(?::.*?)?=\s*['"])[^'"]*(['"])''',
    '''(^{\s*"version"\s*:\s*")[^"]*("\s*})''',
]

[tool.poetry-dynamic-versioning.files."mirageoscience/hooks/_version.py"]
persistent-substitution = true
initial-content = """
__version__ = "0.0.0.dev0"
"""

[tool.poetry-dynamic-versioning.files."_version.json"]
persistent-substitution = true
initial-content = """
{ "version": "0.0.0.dev0" }
"""

[tool.ruff]
target-version = "py310"

[tool.ruff.lint]
ignore = [
    "B028",  # no-explicit-stacklevel for warnings.warn()
    "E501",  # line-too-long - code is reformatted (do not care about comments and docstring)
    "F401",  # unsused-import - covered by pycln
]
select = [
    "A",  # flake8-builtins
    "B",  # flake8-bugbear
    "B006",  # Do not use mutable data structures for argument defaults
    "B9",  # flake8-bugbear opiniated warnings
    "BLE",  # flake8-blind-except
    "C4",  # flake8-comprehensions
    "C9",  # mccabe
    "E",  # pycodestyle errors
    "F",  # pyflakes
    "I",  # isort
    "RUF",  # ruff rules
    "TID", # flake8-tidy-imports
    "UP",  # pyupgrade
    "W",  # pycodestyle warnings
]

[tool.ruff.lint.mccabe]
max-complexity = 18

[tool.ruff.lint.isort]
lines-after-imports = 2

[tool.ruff.format]
# default formatting is just fine

[tool.mypy]
warn_unused_configs = true
ignore_missing_imports = true
scripts_are_modules = true
show_error_context = true
show_column_numbers = true
check_untyped_defs = true

[tool.pytest.ini_options]
#addopts =

[tool.coverage.run]
branch = true
source = ["mirageoscience"]
omit = []

[tool.coverage.report]
exclude_lines = [
    "raise NotImplementedError",
    "pass",
    "if TYPE_CHECKING",
    "pragma: no cover"
]

fail_under = 60

[tool.coverage.html]
skip_empty = true
skip_covered = true
