name: Python analysis

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**
  push:
    branches:
      - develop
      - main
      - release/**
      - feature/**
      - hotfix/**

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  call-workflow-static-analysis:
    name: Static analysis
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-static_analysis.yml@edb72d7524d25db3b4eb976890eb6837a8eb39f8 # v4.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'poetry'
      app-name: 'mirageoscience'
      python-version: '3.14'
  # Also verify the pre-commit hook via CI-tools; pre-commit.ci runs it separately.
  call-workflow-pre-commit:
    name: Pre-Commit
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-pre_commit.yml@edb72d7524d25db3b4eb976890eb6837a8eb39f8 # v4.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      app-name: 'mirageoscience'
      python-version: '3.14'
  call-workflow-pytest:
    name: Pytest
    uses: MiraGeoscience/CI-tools/.github/workflows/reusable-python-pytest.yml@edb72d7524d25db3b4eb976890eb6837a8eb39f8 # v4.0.1
    permissions:
      contents: read
      pull-requests: read
    with:
      package-manager: 'poetry'
      python-versions: '["3.12", "3.14"]'
      os: '["ubuntu-latest", "windows-latest"]'
      cache-number: 1
      codecov-reference-python-version: '3.14'
      codecov-reference-os: '["windows-latest"]'
    secrets:
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
