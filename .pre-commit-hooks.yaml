-   id: check-copyright
    name: check-copyright
    description: check for valid copyright statements in given files
    entry: check_copyright
    language: python
    types: [text]

-   id: prepare-commit-msg
    name: prepare commit message
    description: add the branch JIRA ID to the subject or, with --issue-trailer, an Issue trailer
    entry: git_message_hook --prepare
    language: python
    stages: [prepare-commit-msg]

-   id: check-commit-msg
    name: check commit message
    description: check for a valid JIRA ID in the subject or, with --issue-trailer, an Issue trailer
    entry: git_message_hook --check
    language: python
    stages: [commit-msg]
